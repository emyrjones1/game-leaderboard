<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Submit Score</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>Submit Round Score</h1>

<form id="scoreForm">

<label>Team</label>

<input
type="text"
id="team"
required>

<label>Round</label>

<input
type="number"
id="round"
required>

<label>Points</label>

<input
type="number"
id="points"
required>

<button type="submit">

Submit Score

</button>

</form>

<p id="message"></p>

<script src="script.js"></script>

</body>

</html>
