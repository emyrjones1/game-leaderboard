<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Submit Score</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="admin-page">


<div class="form-container">


<h1>
🏔️ Submit Score
</h1>

<p class="subtitle">
Enter your team's round score
</p>


<form id="scoreForm">


<label>
Team
</label>


<select id="team" required>

<option value="">
Select team
</option>

<option value="Yr Wyddfa">
Yr Wyddfa
</option>

<option value="Pen y Fan">
Pen y Fan
</option>

<option value="Cadair Idris">
Cadair Idris
</option>

<option value="Tryfan">
Tryfan
</option>

<option value="Sugar Loaf">
Sugar Loaf
</option>

</select>



<label>
Challenge
</label>


<select id="challenge" required>

<option value="">
Select challenge
</option>

<option value="Chain Reaction">
Chain Reaction
</option>

<option value="Guess Who">
Guess Who
</option>

<option value="Give Us a Clue">
Give Us a Clue
</option>

<option value="Family Feud">
Family Feud
</option>

<option value="Team Challenge">
Team Challenge
</option>

</select>



<label>
Points
</label>


<input
type="number"
id="points"
placeholder="Enter points"
inputmode="numeric"
required
>



<button type="submit">

Submit Score

</button>


</form>


<p id="message"></p>


</div>


<script src="admin.js"></script>


</body>

</html>
