<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Submit Score</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>Submit Round Score</h1>

<form id="scoreForm">

<label for="team">Team</label>

<select id="team" required>

    <option value="">Select team</option>
    <option value="Team 1">Team 1</option>
    <option value="Team 2">Team 2</option>
    <option value="Team 3">Team 3</option>
    <option value="Team 4">Team 4</option>
    <option value="Team 5">Team 5</option>

</select>


<label for="challenge">Round</label>

<select id="challenge" required>

    <option value="">Select round</option>
    <option value="Chain Reaction">Chain Reaction</option>
    <option value="Guess Who">Guess Who</option>
    <option value="Connections">Connections</option>
    <option value="Family Feud">Family Feud</option>
    <option value="Team Challenge">Team Challenge</option>

</select>


<label for="points">Points</label>

<input
    type="number"
    id="points"
    placeholder="Enter points"
    required>


<button type="submit">
    Submit Score
</button>

</form>


<p id="message"></p>

</div>


<script src="admin.js"></script>

</body>

</html>
